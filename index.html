<body>
<div id="map"></div>
<button id="map-btn-fullscreen" class="fs-btn" title="Fullscreen"><svg id="fsIconExpand" viewBox="0 0 24 24" style="display:block"><polyline points="4,9 4,4 9,4"/><polyline points="20,9 20,4 15,4"/><polyline points="4,15 4,20 9,20"/><polyline points="20,15 20,20 15,20"/></svg><svg id="fsIconCollapse" viewBox="0 0 24 24" style="display:none"><polyline points="9,4 4,4 4,9"/><polyline points="15,4 20,4 20,9"/><polyline points="9,20 4,20 4,15"/><polyline points="15,20 20,20 20,15"/></svg></button>
<button id="map-btn-locate" class="fs-btn" title="Show my location"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display:block"><circle cx="12" cy="12" r="4"></circle><circle cx="12" cy="12" r="8"></circle><line x1="12" y1="1" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="23"></line><line x1="1" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="23" y2="12"></line></svg></button>
<button id="map-btn-layers" class="fs-btn" title="Switch basemap"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><polygon points="12 2 22 8.5 12 15 2 8.5 12 2"></polygon><polyline points="2 15.5 12 22 22 15.5"></polyline></svg></button>
<button id="map-btn-reset" class="fs-btn" title="Reset view"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg></button>
<div id="lp-toast"></div>

<script>
/* ===== MAP BUTTONS: reset / layers / locate / fullscreen (matches The Ethels map) ===== */
function lpInitControls(opts){
  const map=opts.map;
  const $=id=>document.getElementById(id);
  const params=new URLSearchParams(location.search);
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent||"")||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const fsTab=params.get("fs")==="1";
  if(fsTab) document.body.classList.add("fs-mode");

  map.addControl(new mapboxgl.AttributionControl({compact:true}),"bottom-right");

  function flash(b){ if(!b) return; b.style.background="rgba(56,153,236,0.55)"; setTimeout(()=>{ b.style.background=""; if(b.blur) b.blur(); },500); }
  let toastTimer=null;
  function toast(msg){ const t=$("lp-toast"); if(!t) return; t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3000); }

  /* Reset */
  $("map-btn-reset").addEventListener("click",e=>{ flash(e.currentTarget); opts.reset(); });

  /* Layers */
  let styleIdx=0;
  $("map-btn-layers").addEventListener("click",e=>{
    flash(e.currentTarget);
    styleIdx=1-styleIdx;
    map.once("style.load",()=>{
      try{ if(opts.afterStyle) opts.afterStyle(); }catch(err){}
      if(loc.on && loc.pt) drawLoc();
    });
    map.setStyle(opts.styles[styleIdx]);
  });

  /* Fullscreen */
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  function updFsIcons(){
    const on=!!isFs()||(fsTab&&ios);
    $("fsIconExpand").style.display=on?"none":"block";
    $("fsIconCollapse").style.display=on?"block":"none";
  }
  document.addEventListener("fullscreenchange",updFsIcons);
  document.addEventListener("webkitfullscreenchange",updFsIcons);
  updFsIcons();
  $("map-btn-fullscreen").addEventListener("click",()=>{
    if(fsTab&&ios){ window.close(); return; }
    if(ios){ const u=new URL(location.href); u.searchParams.set("fs","1"); window.open(u.toString(),"_blank"); return; }
    if(!isFs()){ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
    else{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  });

  /* Locate */
  const loc={on:false,first:true,pt:null,acc:0,timer:null,bridgeTimer:null,useBridge:false};
  const EMPTY={type:"FeatureCollection",features:[]};
  const inFrame=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
  function circle(lng,lat,m){
    const pts=[],dLat=m/110540,dLng=m/(111320*Math.cos(lat*Math.PI/180));
    for(let i=0;i<=48;i++){ const a=i/48*2*Math.PI; pts.push([lng+dLng*Math.cos(a),lat+dLat*Math.sin(a)]); }
    return {type:"Feature",geometry:{type:"Polygon",coordinates:[pts]}};
  }
  function ensureLocLayers(){
    if(!map.getSource("lp-me")) map.addSource("lp-me",{type:"geojson",data:EMPTY});
    if(!map.getSource("lp-acc")) map.addSource("lp-acc",{type:"geojson",data:EMPTY});
    if(!map.getLayer("lp-acc-fill")) map.addLayer({id:"lp-acc-fill",type:"fill",source:"lp-acc",paint:{"fill-color":"#3899EC","fill-opacity":.15}});
    if(!map.getLayer("lp-acc-line")) map.addLayer({id:"lp-acc-line",type:"line",source:"lp-acc",paint:{"line-color":"#3899EC","line-width":1.5,"line-opacity":.5}});
    if(!map.getLayer("lp-me-dot")) map.addLayer({id:"lp-me-dot",type:"circle",source:"lp-me",paint:{"circle-radius":7,"circle-color":"#3899EC","circle-stroke-width":3,"circle-stroke-color":"#fff"}});
  }
  function drawLoc(){
    ensureLocLayers();
    map.getSource("lp-me").setData(loc.pt?{type:"Feature",geometry:{type:"Point",coordinates:loc.pt}}:EMPTY);
    map.getSource("lp-acc").setData(loc.pt&&loc.acc>0?circle(loc.pt[0],loc.pt[1],loc.acc):EMPTY);
  }
  function gotLoc(lat,lng,acc){
    if(!loc.on) return;
    clearTimeout(loc.bridgeTimer);
    loc.pt=[lng,lat]; loc.acc=acc||0; drawLoc();
    if(loc.first){ loc.first=false; map.flyTo({center:loc.pt,zoom:Math.max(map.getZoom(),14),duration:1000}); }
    clearTimeout(loc.timer); loc.timer=setTimeout(requestLoc,5000);
  }
  function locFail(msg){ stopLoc(); toast(msg||"Location unavailable"); }
  function askBridge(){
    loc.useBridge=true;
    try{ (window.opener&&!window.opener.closed?window.opener:window.parent).postMessage({type:"requestLocation"},"*"); }catch(e){}
    clearTimeout(loc.bridgeTimer);
    loc.bridgeTimer=setTimeout(()=>locFail("Location unavailable"),8000);
  }
  function requestLoc(){
    if(!loc.on) return;
    if(loc.useBridge){ askBridge(); return; }
    if(!navigator.geolocation){ inFrame?askBridge():locFail("Location not supported"); return; }
    navigator.geolocation.getCurrentPosition(
      p=>gotLoc(p.coords.latitude,p.coords.longitude,p.coords.accuracy),
      err=>{ if(inFrame&&loc.first) askBridge(); else locFail(err&&err.message?err.message:"Location unavailable"); },
      {enableHighAccuracy:true,timeout:7500,maximumAge:0}
    );
  }
  function startLoc(){ loc.on=true; loc.first=true; $("map-btn-locate").style.background="rgba(56,153,236,0.55)"; requestLoc(); }
  function stopLoc(){
    loc.on=false; loc.pt=null; loc.useBridge=false;
    clearTimeout(loc.timer); clearTimeout(loc.bridgeTimer);
    if(map.getSource("lp-me")) drawLoc();
    $("map-btn-locate").style.background="";
  }
  $("map-btn-locate").addEventListener("click",()=>{ loc.on?stopLoc():startLoc(); });
  window.addEventListener("message",e=>{
    const d=e.data; if(!d||!d.type||!loc.on) return;
    if(d.type==="userLocation") gotLoc(d.lat,d.lng,d.accuracy);
    else if(d.type==="locationError") locFail(d.message);
  });
}
</script>

async function loadGpx(url){
  const res=await fetch(url);
  const xml=new DOMParser().parseFromString(await res.text(),"text/xml");
  const gj=toGeoJSON.gpx(xml);
  return gj.features.find(f=>f.geometry?.type==="LineString");
}

const HOME_BOUNDS=new mapboxgl.LngLatBounds();
const isMobile=window.innerWidth<=768;

function setMarkerColor(id,color){
  const el=markerElsById[id];
  if(!el) return;
  const p=el.querySelector("path");
  if(p) p.setAttribute("fill",color);
}

function addRoute(h,lineFeature){
  const id=h.id, coords=lineFeature.geometry.coordinates;
  let dists=[0];
  for(let i=1;i<coords.length;i++){
    const dx=coords[i][0]-coords[i-1][0],dy=coords[i][1]-coords[i-1][1];
    dists.push(dists[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  const total=dists[dists.length-1];
  const srcBase=`rb-${id}`,srcAnim=`ra-${id}`,lyrBase=`rl-${id}`,lyrAnim=`la-${id}`;
  if(!map.getSource(srcBase)) map.addSource(srcBase,{type:"geojson",data:lineFeature});
  if(!map.getLayer(lyrBase)) map.addLayer({id:lyrBase,type:"line",source:srcBase,paint:{"line-color":RED,"line-width":3.5,"line-opacity":0.7}});
  if(!map.getSource(srcAnim)) map.addSource(srcAnim,{type:"geojson",lineMetrics:true,data:{type:"Feature",geometry:{type:"LineString",coordinates:[]}}});
  if(!map.getLayer(lyrAnim)) map.addLayer({id:lyrAnim,type:"line",source:srcAnim,layout:{"line-cap":"round","line-join":"round"},paint:{
    "line-width":3.5,
    "line-opacity":0,
    "line-gradient":["interpolate",["linear"],["line-progress"],0,"#3899EC",1,"#FF8C00"]
  }});
  routeLayers[id]={srcBase,srcAnim,lyrBase,lyrAnim,coords,dists,total};
}

function showRoute(id){
  const r=routeLayers[id]; if(!r||!map.getLayer(r.lyrAnim)) return;
  map.setPaintProperty(r.lyrAnim,"line-opacity",1);
  startAnim(id);
}
function hideRoute(id){
  const r=routeLayers[id]; if(!r) return;
  stopAnim(id);
  if(map.getLayer(r.lyrAnim)) map.setPaintProperty(r.lyrAnim,"line-opacity",0);
}
function startAnim(id){
  stopAnim(id);
  const r=routeLayers[id]; if(!r) return;
  const DUR=5500; let t0=null;
  function frame(ts){
    if(!routeAnims[id]?.active) return;
    if(!t0) t0=ts;
    const prog=((ts-t0)%DUR)/DUR, dist=prog*r.total, pts=[];
    for(let i=0;i<r.coords.length;i++){
      if(r.dists[i]<=dist){ pts.push(r.coords[i]); }
      else{
        if(pts.length>0&&i>0){
          const seg=r.dists[i]-r.dists[i-1],t=seg>0?(dist-r.dists[i-1])/seg:0;
          const p=r.coords[i-1],q=r.coords[i];
          pts.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])]);
        }
        break;
      }
    }
    if(pts.length>=2){ const src=map.getSource(r.srcAnim); if(src) src.setData({type:"Feature",geometry:{type:"LineString",coordinates:pts}}); }
    routeAnims[id].raf=requestAnimationFrame(frame);
  }
  routeAnims[id]={active:true,raf:requestAnimationFrame(frame)};
}
function stopAnim(id){
  if(routeAnims[id]){ routeAnims[id].active=false; cancelAnimationFrame(routeAnims[id].raf); delete routeAnims[id]; }
  const r=routeLayers[id];
  if(r){ const src=map.getSource(r.srcAnim); if(src) src.setData({type:"Feature",geometry:{type:"LineString",coordinates:[]}}); }
}

function showHoverPopup(h){
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  setMarkerColor(h.id,BLUE); showRoute(h.id);
  hoverPopupObj=new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
    .setLngLat(h.coords).setHTML(popupHtmlFor(h,false)).addTo(map);
}
function hideHoverPopup(id){
  if(lockedId===id) return;
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  hideRoute(id); setMarkerColor(id,RED);
}
function lockHike(h){
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  if(lockedId!==null&&lockedId!==h.id){
    hideRoute(lockedId); setMarkerColor(lockedId,RED);
    if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
  }
  if(lockedId===h.id){ closeLocked(); return; }
  lockedId=h.id; setMarkerColor(h.id,BLUE); showRoute(h.id);
  map.panTo(h.coords,{duration:300});
  const p=new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
    .setLngLat(h.coords).setHTML(popupHtmlFor(h,true)).addTo(map);
  lockedPopups[h.id]=p;
}
function closeLocked(evt){
  if(evt){ evt.preventDefault(); evt.stopPropagation(); }
  if(lockedId!==null){
    hideRoute(lockedId); setMarkerColor(lockedId,RED);
    if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
    const el=markerElsById[lockedId]; if(el) el.classList.remove("info-hidden");
    infoHiddenIds.delete(lockedId);
    lockedId=null;
  }
}
window.closeLocked=closeLocked;

function resetMapView(){
  if(HOME_BOUNDS.isEmpty()) return;
  map.fitBounds(HOME_BOUNDS,{padding:isMobile?30:110,maxZoom:isMobile?14:10.5,duration:900});
}

lpInitControls({
  map,
  styles:MAP_STYLES,
  reset:resetMapView,
  afterStyle:()=>{
    hikes.forEach(h=>{ if(routeLines[h.id]) addRoute(h,routeLines[h.id]); });
    if(lockedId) showRoute(lockedId);
  }
});

map.on("load",async()=>{
  hikes.forEach(h=>{
    const el=document.createElement("div");
    el.className="marker";
    el.innerHTML=`<svg width="27" height="41" viewBox="0 0 27 41" xmlns="http://www.w3.org/2000/svg"><path d="M13.5 0C6.044 0 0 6.044 0 13.5c0 9.375 13.5 27.5 13.5 27.5S27 22.875 27 13.5C27 6.044 20.956 0 13.5 0z" fill="${RED}"/><circle cx="13.5" cy="13.5" r="5" fill="white" opacity="0.9"/></svg><div class="marker-eye-overlay"><div onclick="toggleInfo('${h.id}',event)" style="position:absolute;top:-11px;left:-11px;width:22px;height:22px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg></div></div>`;
    markerElsById[h.id]=el;
    new mapboxgl.Marker({element:el}).setLngLat(h.coords).addTo(map);
    HOME_BOUNDS.extend(h.coords);
    if(!isMobile){
      el.addEventListener("mouseenter",()=>{ if(lockedId!==h.id&&!infoHiddenIds.has(h.id)) showHoverPopup(h); });
      el.addEventListener("mouseleave",()=>{ if(lockedId!==h.id&&!infoHiddenIds.has(h.id)) hideHoverPopup(h.id); });
    }
    el.addEventListener("click",evt=>{ evt.stopPropagation(); if(infoHiddenIds.has(h.id)){ toggleInfo(h.id,evt); return; } lockHike(h); });
  });
  map.on("click",()=>closeLocked());
  for(const h of hikes){
    try{
      const line=await loadGpx(h.gpx);
      if(line){
        routeLines[h.id]=line;
        addRoute(h,line);
        line.geometry.coordinates.forEach(c=>HOME_BOUNDS.extend(c));
      }
    }catch(e){}
  }
  map.fitBounds(HOME_BOUNDS,{padding:isMobile?30:110,maxZoom:isMobile?14:10.5});
  if(isMobile){
    map.once("idle",()=>{ if(map.getZoom()>11.6) map.setZoom(11.6); });
  }
});

window.toggleInfo=function(id,evt){
  if(evt){ evt.preventDefault(); evt.stopPropagation(); }
  const el=markerElsById[id];
  const h=hikes.find(x=>x.id===id);
  if(!h) return;

  if(infoHiddenIds.has(id)){
    infoHiddenIds.delete(id);
    if(el) el.classList.remove("info-hidden");
    if(lockedPopups[id]){ lockedPopups[id].remove(); delete lockedPopups[id]; }
    lockedId=id;
    const p=new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
      .setLngLat(h.coords).setHTML(popupHtmlFor(h,true)).addTo(map);
    lockedPopups[id]=p;
    return;
  }

  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }

  if(lockedId!==null&&lockedId!==id){
    hideRoute(lockedId);
    if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
    setMarkerColor(lockedId,RED);
    infoHiddenIds.delete(lockedId);
    if(markerElsById[lockedId]) markerElsById[lockedId].classList.remove("info-hidden");
  }

  lockedId=id;
  infoHiddenIds.add(id);
  setMarkerColor(id,BLUE); showRoute(id);
  if(lockedPopups[id]){ lockedPopups[id].remove(); delete lockedPopups[id]; }
  if(el) el.classList.add("info-hidden");
};
</script>
